name: Bug
description: Something is broken.
title: "[Bug]: "
type: Bug
projects:
  - "jdnb1/5"
body:
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
      placeholder: "Example: The form submits and redirects to the confirmation page."
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include any error messages or unexpected output.
      placeholder: "Example: The page reloads and shows a 500 error."
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Walk us through how to trigger this bug, step by step.
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true
